name: Release

on:
  push:
    tags:
      - 'v*'

env:
  # The Emscripten release the core is built with, pinned: `latest` changes
  # under the package between releases. 0.1.3 was built by one that puts no
  # HEAP views on Module unless they are exported, and built no maps.
  EMSDK_VERSION: '6.0.4'

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package version
        run: npm run release:verify-tag -- "${GITHUB_REF_NAME}"

      - name: Install deps
        run: npm ci

      - name: Setup Emscripten
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build + test
        shell: bash
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          npm run build
          npm test

      - name: Package dry-run
        run: npm run pack:dry-run

      - name: Ensure npm token exists
        run: test -n "${NODE_AUTH_TOKEN}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npmjs.org
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
